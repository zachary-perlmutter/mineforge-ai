---
- name: System tuning for Minecraft and K3s
  hosts: k3s_server
  become: true

  tasks:
    - name: Set ulimits for open files (Minecraft + Java need high limits)
      copy:
        dest: /etc/security/limits.d/mineforge.conf
        content: |
          *    soft nofile 65536
          *    hard nofile 65536
          root soft nofile 65536
          root hard nofile 65536
        mode: "0644"

    - name: Tune kernel network parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-mineforge.conf
        reload: true
      loop:
        # Increase TCP buffer sizes for better throughput
        - { name: net.core.rmem_max, value: "16777216" }
        - { name: net.core.wmem_max, value: "16777216" }
        - { name: net.ipv4.tcp_rmem, value: "4096 87380 16777216" }
        - { name: net.ipv4.tcp_wmem, value: "4096 65536 16777216" }
        # Reduce TIME_WAIT sockets (Minecraft creates many short connections)
        - { name: net.ipv4.tcp_tw_reuse, value: "1" }
        - { name: net.ipv4.tcp_fin_timeout, value: "15" }
        # Increase connection backlog for Minecraft
        - { name: net.core.somaxconn, value: "4096" }
        - { name: net.ipv4.tcp_max_syn_backlog, value: "4096" }
        # Keep swappiness low (already set in k3s-install, enforce here too)
        - { name: vm.swappiness, value: "10" }
        # Increase inotify limits for Kubernetes
        - { name: fs.inotify.max_user_instances, value: "8192" }
        - { name: fs.inotify.max_user_watches, value: "524288" }

    - name: Set transparent hugepages to madvise (better for Java/JVM)
      copy:
        dest: /etc/rc.local
        content: |
          #!/bin/bash
          echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
          echo madvise > /sys/kernel/mm/transparent_hugepage/defrag
          exit 0
        mode: "0755"

    - name: Apply transparent hugepages now
      shell: |
        echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
        echo madvise > /sys/kernel/mm/transparent_hugepage/defrag
      changed_when: false

    - name: Install chrony for time sync (Minecraft is sensitive to clock drift)
      apt:
        name: chrony
        state: present

    - name: Enable and start chrony
      systemd:
        name: chrony
        enabled: true
        state: started
