---
- name: Firewall rules and security hardening
  hosts: k3s_server
  become: true

  tasks:
    - name: Install UFW and fail2ban
      apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Reset UFW to defaults
      ufw:
        state: reset

    - name: Set UFW default incoming policy to deny
      ufw:
        default: deny
        direction: incoming

    - name: Set UFW default outgoing policy to allow
      ufw:
        default: allow
        direction: outgoing

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow Kubernetes API
      ufw:
        rule: allow
        port: "6443"
        proto: tcp

    - name: Allow Minecraft
      ufw:
        rule: allow
        port: "25565"
        proto: tcp

    - name: Allow BlueMap
      ufw:
        rule: allow
        port: "30100"
        proto: tcp

    - name: Allow Grafana
      ufw:
        rule: allow
        port: "30080"
        proto: tcp

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Allow NodePort range
      ufw:
        rule: allow
        port: "25000:32767"
        proto: tcp

    - name: Allow Flannel VXLAN (inter-node)
      ufw:
        rule: allow
        port: "8472"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Configure fail2ban for SSH
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime  = 3600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled = true
          port    = ssh
          logpath = %(sshd_log)s
        mode: "0644"

    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: true
        state: restarted

    - name: Harden SSH — disable root login and password auth
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
      notify: Restart SSH

    - name: Set login banner
      copy:
        dest: /etc/motd
        content: |
          ╔══════════════════════════════════════╗
          ║        MineForge AI — K3s Node       ║
          ║  Unauthorized access is prohibited.  ║
          ╚══════════════════════════════════════╝
        mode: "0644"

  handlers:
    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
