---
- name: Longhorn prerequisites
  hosts: k3s_server
  become: true

  tasks:
    - name: Install Longhorn dependencies
      apt:
        name:
          - open-iscsi
          - nfs-common
          - cryptsetup
          - dmsetup
        state: present
        update_cache: true

    - name: Enable and start iscsid
      systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - iscsi_tcp
        - dm_crypt

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/longhorn.conf
        content: |
          iscsi_tcp
          dm_crypt
        mode: "0644"

    - name: Check multipathd is not interfering with Longhorn
      lineinfile:
        path: /etc/multipath.conf
        create: true
        line: "blacklist { devnode \"^sd[a-z0-9]+\" }"
        state: present
      notify: Restart multipathd

  handlers:
    - name: Restart multipathd
      systemd:
        name: multipathd
        state: restarted
      ignore_errors: true
