apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zachary-perlmutter/mineforge-ai.git
    targetRevision: HEAD
    path: k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false   # don't auto-prune monitoring — Helm manages most of it
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
