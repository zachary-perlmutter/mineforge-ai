apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mineforge-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: minecraft
      rules:
        - alert: MinecraftPodDown
          expr: kube_pod_status_ready{namespace="minecraft", condition="true"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Minecraft pod is down"
            description: "The Minecraft pod has not been ready for more than 1 minute."

        - alert: MinecraftPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="minecraft"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Minecraft pod is crash-looping"
            description: "Minecraft container has restarted {{ $value | humanize }} times in the last 15 minutes."

        - alert: NodeMemoryHigh
          expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high"
            description: "Node memory usage is above 85% for more than 5 minutes (current: {{ $value | humanize }}%)."

        - alert: NodeSwapHigh
          expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100 > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Swap usage is high"
            description: "Swap usage is above 50% — node may be memory constrained."

        - alert: NodeCPUHigh
          expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage is high"
            description: "CPU usage has been above 90% for more than 5 minutes."
