apiVersion: v1
kind: ServiceAccount
metadata:
  name: mineforge-agent
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mineforge-agent
  namespace: minecraft
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mineforge-agent
  namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mineforge-agent
subjects:
  - kind: ServiceAccount
    name: mineforge-agent
    namespace: minecraft
